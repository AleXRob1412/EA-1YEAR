<script>

"U2FsdGVkX1+Q2z0mYkZ7k1mQqTz8c3v6lP4b8n5x2sA=",

function normalize(t){

return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

}

function decrypt(e){

try{

return CryptoJS.AES.decrypt(e,KEY).toString(CryptoJS.enc.Utf8);

}catch{return "";}

}

function validate(input,level){

let user=normalize(input);

let real=normalize(decrypt(encrypted[level]));

return user===real;

}



const term=document.getElementById("terminal");

const input=document.getElementById("cmd");

let level=localStorage.getItem("ea_level")?parseInt(localStorage.getItem("ea_level")):0;

function print(t){

term.innerHTML+=t+"\n";

term.scrollTop=term.scrollHeight;

}

function progress(){

document.getElementById("bar").style.width=(level/12*100)+"%";

}


input.addEventListener("keydown",function(e){

}

}

else if(cmd.startsWith("unlock")){

if(level===12){

final();

}else{

}
